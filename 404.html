<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Página no encontrada | Tu Web Atractiva</title>
    <meta name="description" content="Ups! La página que buscas no existe. Descubre nuestros servicios de diseño web profesional en Tu Web Atractiva.">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
    
    <style>
        .error-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            position: relative;
            overflow: hidden;
        }
        
        .error-container {
            text-align: center;
            color: white;
            max-width: 600px;
            padding: 2rem;
            position: relative;
            z-index: 2;
        }
        
        .error-code {
            font-size: 8rem;
            font-weight: 700;
            margin: 0;
            text-shadow: 0 4px 20px rgba(0,0,0,0.3);
            animation: bounce 2s infinite;
        }
        
        .error-icon {
            font-size: 4rem;
            margin: 1rem 0;
            animation: wiggle 1s ease-in-out infinite;
        }
        
        .error-title {
            font-size: 2rem;
            margin: 1rem 0;
            font-weight: 600;
        }
        
        .error-message {
            font-size: 1.2rem;
            margin: 1.5rem 0;
            opacity: 0.9;
            line-height: 1.6;
        }
        
        .error-actions {
            display: flex;
            gap: 1rem;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 2rem;
        }
        
        .btn-404 {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.75rem 1.5rem;
            background: rgba(255,255,255,0.2);
            color: white;
            text-decoration: none;
            border-radius: 25px;
            border: 2px solid rgba(255,255,255,0.3);
            font-weight: 500;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }
        
        .btn-404:hover {
            background: rgba(255,255,255,0.3);
            border-color: rgba(255,255,255,0.5);
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.2);
        }
        
        .btn-primary-404 {
            background: hsl(0, 70%, 47%);
            border-color: hsl(0, 70%, 47%);
        }
        
        .btn-primary-404:hover {
            background: hsl(0, 70%, 42%);
            border-color: hsl(0, 70%, 42%);
        }
        
        .floating-shapes {
            position: absolute;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: 1;
        }
        
        .shape {
            position: absolute;
            background: rgba(255,255,255,0.1);
            border-radius: 50%;
            animation: float 6s ease-in-out infinite;
        }
        
        .shape:nth-child(1) {
            width: 80px;
            height: 80px;
            top: 20%;
            left: 10%;
            animation-delay: 0s;
        }
        
        .shape:nth-child(2) {
            width: 60px;
            height: 60px;
            top: 60%;
            right: 10%;
            animation-delay: 2s;
        }
        
        .shape:nth-child(3) {
            width: 100px;
            height: 100px;
            bottom: 20%;
            left: 20%;
            animation-delay: 4s;
        }
        
        .shape:nth-child(4) {
            width: 40px;
            height: 40px;
            top: 30%;
            right: 30%;
            animation-delay: 1s;
        }
        
        .home-link {
            position: absolute;
            top: 2rem;
            left: 2rem;
            z-index: 3;
        }
        
        .logo-404 {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            color: white;
            text-decoration: none;
            font-weight: 600;
            font-size: 1.2rem;
        }
        
        .logo-404 img {
            width: 40px;
            height: 40px;
        }
        
        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% {
                transform: translateY(0);
            }
            40% {
                transform: translateY(-10px);
            }
            60% {
                transform: translateY(-5px);
            }
        }
        
        @keyframes wiggle {
            0%, 100% {
                transform: rotate(0deg);
            }
            25% {
                transform: rotate(-10deg);
            }
            75% {
                transform: rotate(10deg);
            }
        }
        
        @keyframes float {
            0%, 100% {
                transform: translateY(0px) rotate(0deg);
            }
            50% {
                transform: translateY(-20px) rotate(180deg);
            }
        }
        
        @media (max-width: 768px) {
            .error-code {
                font-size: 6rem;
            }
            
            .error-title {
                font-size: 1.5rem;
            }
            
            .error-message {
                font-size: 1rem;
            }
            
            .error-actions {
                flex-direction: column;
                align-items: center;
            }
            
            .btn-404 {
                width: 100%;
                max-width: 250px;
                justify-content: center;
            }
            
            .home-link {
                top: 1rem;
                left: 1rem;
            }
            
            .logo-404 {
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>
    <div class="error-page">
        <div class="floating-shapes">
            <div class="shape"></div>
            <div class="shape"></div>
            <div class="shape"></div>
            <div class="shape"></div>
        </div>
        
        <div class="home-link">
            <a href="index.html" class="logo-404">
                <img src="images/logo-new.svg" alt="Tu Web Atractiva">
                <span>Tu Web Atractiva</span>
            </a>
        </div>
        
        <div class="error-container">
            <h1 class="error-code">404</h1>
            <div class="error-icon">
                <i class="fas fa-search"></i>
            </div>
            <h2 class="error-title">¡Ups! Esta página se fue de vacaciones</h2>
            <p class="error-message">
                Parece que la página que buscas decidió tomarse un descanso... 🏖️<br>
                Pero no te preocupes, nosotros seguimos aquí para ayudarte a crear la web de tus sueños.
            </p>
            
            <div class="error-actions">
                <a href="index.html" class="btn-404 btn-primary-404">
                    <i class="fas fa-home"></i>
                    Volver al Inicio
                </a>
                <a href="servicios.html" class="btn-404">
                    <i class="fas fa-globe"></i>
                    Ver Servicios
                </a>
                <a href="ejemplos.html" class="btn-404">
                    <i class="fas fa-images"></i>
                    Ver Ejemplos
                </a>
                <a href="https://wa.me/51938693848?text=Hola,%20necesito%20ayuda%20navegando%20en%20su%20sitio%20web" class="btn-404" target="_blank">
                    <i class="fab fa-whatsapp"></i>
                    Contactar por WhatsApp
                </a>
            </div>
        </div>
    </div>
    
    <script>
        // Add some interactive sparkle effect
        document.addEventListener('mousemove', function(e) {
            if (Math.random() > 0.95) {
                createSparkle(e.clientX, e.clientY);
            }
        });
        
        function createSparkle(x, y) {
            const sparkle = document.createElement('div');
            sparkle.style.cssText = `
                position: fixed;
                left: ${x}px;
                top: ${y}px;
                width: 4px;
                height: 4px;
                background: white;
                border-radius: 50%;
                pointer-events: none;
                z-index: 1000;
                animation: sparkleAnim 1s ease-out forwards;
            `;
            
            document.body.appendChild(sparkle);
            
            setTimeout(() => {
                if (sparkle.parentNode) {
                    sparkle.parentNode.removeChild(sparkle);
                }
            }, 1000);
        }
        
        // Add sparkle animation CSS
        const style = document.createElement('style');
        style.textContent = `
            @keyframes sparkleAnim {
                0% {
                    transform: scale(0) rotate(0deg);
                    opacity: 1;
                }
                100% {
                    transform: scale(1) rotate(180deg);
                    opacity: 0;
                }
            }
        `;
        document.head.appendChild(style);
        
        // Add click sound effect simulation
        document.querySelectorAll('.btn-404').forEach(btn => {
            btn.addEventListener('click', function() {
                this.style.transform = 'scale(0.95)';
                setTimeout(() => {
                    this.style.transform = '';
                }, 100);
            });
        });
    </script>
</body>
</html>
