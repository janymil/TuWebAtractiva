<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Página No Encontrada | Tu Web Atractiva</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" type="image/png" href="generated-icon.png">
    <style>
        .error-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 2rem;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        
        .error-content {
            background: white;
            padding: 3rem;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            max-width: 500px;
            animation: fadeInUp 0.8s ease-out;
        }
        
        .error-number {
            font-size: 8rem;
            font-weight: bold;
            color: #667eea;
            margin: 0;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
            animation: bounce 2s infinite;
        }
        
        .error-title {
            font-size: 2rem;
            color: #333;
            margin: 1rem 0;
        }
        
        .error-message {
            color: #666;
            font-size: 1.1rem;
            margin: 1.5rem 0;
            line-height: 1.6;
        }
        
        .error-actions {
            margin-top: 2rem;
        }
        
        .btn-home {
            display: inline-block;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 12px 30px;
            text-decoration: none;
            border-radius: 25px;
            font-weight: 600;
            transition: transform 0.3s ease;
            margin: 0.5rem;
        }
        
        .btn-home:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }
        
        .btn-back {
            display: inline-block;
            background: transparent;
            color: #667eea;
            padding: 12px 30px;
            text-decoration: none;
            border: 2px solid #667eea;
            border-radius: 25px;
            font-weight: 600;
            transition: all 0.3s ease;
            margin: 0.5rem;
        }
        
        .btn-back:hover {
            background: #667eea;
            color: white;
        }
        
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% {
                transform: translateY(0);
            }
            40% {
                transform: translateY(-10px);
            }
            60% {
                transform: translateY(-5px);
            }
        }
        
        .dark-mode .error-content {
            background: #2d3748;
            color: #e2e8f0;
        }
        
        .dark-mode .error-title {
            color: #e2e8f0;
        }
        
        .dark-mode .error-message {
            color: #a0aec0;
        }
    </style>
</head>
<body>
    <div class="error-container">
        <div class="error-content">
            <h1 class="error-number">404</h1>
            <h2 class="error-title">¡Oops! Página no encontrada</h2>
            <p class="error-message">
                Parece que la página que buscas se ha tomado unas vacaciones permanentes. 
                Pero no te preocupes, tenemos muchas otras páginas geniales esperándote.
            </p>
            <div class="error-actions">
                <a href="/" class="btn-home">Ir al Inicio</a>
                <a href="javascript:history.back()" class="btn-back">Regresar</a>
            </div>
        </div>
    </div>
    
    <script>
        // Dark mode support
        if (localStorage.getItem('darkMode') === 'enabled') {
            document.body.classList.add('dark-mode');
        }
    </script>
</body>
</html>
