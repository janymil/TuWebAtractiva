<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <!-- Background -->
  <rect fill="#f8f9fa" width="400" height="300"/>
  
  <!-- Header -->
  <rect fill="#8B4513" width="400" height="50"/>
  <text x="20" y="30" fill="white" font-family="Arial" font-size="16" font-weight="bold">⚖️ Dr. Carlos Mendoza</text>
  <rect fill="#A0522D" x="280" y="15" width="100" height="20" rx="10"/>
  <text x="320" y="27" fill="white" font-family="Arial" font-size="10">Contacto</text>
  
