  <text x="62" y="245" fill="#666" font-family="Arial" font-size="8" text-anchor="middle">Sucesiones</text>
  
  <rect fill="white" x="115" y="170" width="85" height="100" rx="8" stroke="#8B4513" stroke-width="2"/>
