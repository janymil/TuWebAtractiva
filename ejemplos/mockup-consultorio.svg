<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <linearGradient id="medicalGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2E7D32;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1B5E20;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="trustGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1976D2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1565C0;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="peruGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#C4302B;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#A02A26;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="softGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E8F5E8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#C8E6C9;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background representing consultorio website -->
  <rect width="400" height="300" fill="url(#softGradient)"/>
  
  <!-- Header/Navigation -->
  <rect x="0" y="0" width="400" height="50" fill="url(#trustGradient)"/>
  
  <!-- Logo area -->
  <rect x="20" y="10" width="120" height="30" rx="3" fill="#fff" opacity="0.95"/>
  <text x="80" y="20" text-anchor="middle" font-family="serif" font-size="8" fill="#1976D2" font-weight="bold">Dr. Carlos Mendoza</text>
  <text x="80" y="30" text-anchor="middle" font-family="serif" font-size="6" fill="#2E7D32" font-style="italic">Psicólogo Clínico</text>
  <text x="80" y="37" text-anchor="middle" font-family="serif" font-size="5" fill="#1565C0">COP 12345</text>
  
  <!-- Navigation menu -->
  <rect x="260" y="18" width="25" height="4" rx="1" fill="#fff" opacity="0.9"/>
  <rect x="295" y="18" width="30" height="4" rx="1" fill="#fff" opacity="0.9"/>
  <rect x="335" y="18" width="25" height="4" rx="1" fill="#fff" opacity="0.9"/>
  <rect x="370" y="18" width="20" height="4" rx="1" fill="#fff" opacity="0.9"/>
  
  <!-- Medical cross icon -->
  <rect x="160" y="18" width="20" height="15" rx="2" fill="#fff" opacity="0.9"/>
  <rect x="167" y="21" width="6" height="2" fill="#2E7D32"/>
  <rect x="169" y="19" width="2" height="6" fill="#2E7D32"/>
  
  <!-- Hero section -->
  <rect x="0" y="50" width="400" height="110" fill="#fff" opacity="0.7"/>
  
  <!-- Professional photo placeholder -->
  <rect x="30" y="65" width="100" height="80" rx="8" fill="#fff" stroke="#E5E7EB" stroke-width="2"/>
  <circle cx="80" cy="95" r="20" fill="url(#trustGradient)" opacity="0.8"/>
  <circle cx="80" cy="88" r="8" fill="#fff"/>
  <path d="M 70 105 Q 80 95 90 105 Q 80 115 70 105" fill="#fff"/>
  
  <!-- Professional credentials -->
  <rect x="150" y="70" width="100" height="6" rx="2" fill="#1976D2"/>
  <rect x="150" y="82" width="120" height="4" rx="1" fill="#2C3E50" opacity="0.8"/>
  <rect x="150" y="90" width="140" height="3" rx="1" fill="#2C3E50" opacity="0.6"/>
  <rect x="150" y="97" width="110" height="3" rx="1" fill="#2C3E50" opacity="0.6"/>
  
  <!-- Specializations -->
  <rect x="150" y="108" width="80" height="3" rx="1" fill="#2E7D32" opacity="0.8"/>
  <rect x="150" y="114" width="90" height="3" rx="1" fill="#2E7D32" opacity="0.8"/>
  <rect x="150" y="120" width="70" height="3" rx="1" fill="#2E7D32" opacity="0.8"/>
  
  <!-- Appointment button -->
  <rect x="150" y="130" width="100" height="20" rx="10" fill="url(#peruGradient)"/>
  <circle cx="170" cy="140" r="6" fill="#fff"/>
  <rect x="167" y="137" width="6" height="2" fill="#C4302B"/>
  <rect x="169" y="135" width="2" height="6" fill="#C4302B"/>
  <text x="210" y="143" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#fff" font-weight="bold">Agendar Cita</text>
  
  <!-- WhatsApp consultation -->
  <rect x="260" y="130" width="90" height="20" rx="10" fill="#25D366"/>
  <circle cx="280" cy="140" r="6" fill="#fff"/>
  <path d="M 277 140 Q 280 137 283 140 Q 280 143 277 140" fill="#25D366"/>
  <text x="320" y="143" text-anchor="middle" font-family="sans-serif" font-size="7" fill="#fff" font-weight="bold">Consulta Online</text>
  
  <!-- Services section -->
  <rect x="20" y="175" width="360" height="6" rx="2" fill="#1976D2"/>
  <text x="200" y="185" text-anchor="middle" font-family="serif" font-size="9" fill="#1976D2" font-weight="bold">Servicios Especializados</text>
  
  <!-- Service cards -->
  <g transform="translate(30, 200)">
    <!-- Service 1 - Individual Therapy -->
    <rect x="0" y="0" width="100" height="70" rx="5" fill="#fff" stroke="#E5E7EB"/>
    <rect x="5" y="5" width="90" height="40" rx="3" fill="url(#trustGradient)" opacity="0.3"/>
    <circle cx="50" cy="20" r="8" fill="#1976D2"/>
    <circle cx="50" cy="18" r="3" fill="#fff"/>
    <path d="M 45 25 Q 50 20 55 25 Q 50 30 45 25" fill="#fff"/>
    <rect x="5" y="48" width="70" height="3" rx="1" fill="#2C3E50"/>
    <rect x="5" y="54" width="50" height="3" rx="1" fill="#2C3E50" opacity="0.6"/>
    <rect x="5" y="60" width="40" height="4" rx="1" fill="url(#peruGradient)"/>
    
    <!-- Service 2 - Couple Therapy -->
    <rect x="110" y="0" width="100" height="70" rx="5" fill="#fff" stroke="#E5E7EB"/>
    <rect x="115" y="5" width="90" height="40" rx="3" fill="url(#medicalGradient)" opacity="0.3"/>
    <circle cx="150" cy="20" r="6" fill="#2E7D32"/>
    <circle cx="160" cy="20" r="6" fill="#2E7D32"/>
    <path d="M 150 25 Q 155 20 160 25" stroke="#fff" stroke-width="2" fill="none"/>
    <rect x="115" y="48" width="75" height="3" rx="1" fill="#2C3E50"/>
    <rect x="115" y="54" width="60" height="3" rx="1" fill="#2C3E50" opacity="0.6"/>
    <rect x="115" y="60" width="45" height="4" rx="1" fill="url(#peruGradient)"/>
    
    <!-- Service 3 - Online Consultation -->
    <rect x="220" y="0" width="100" height="70" rx="5" fill="#fff" stroke="#E5E7EB"/>
    <rect x="225" y="5" width="90" height="40" rx="3" fill="url(#trustGradient)" opacity="0.4"/>
    <rect x="260" y="15" width="20" height="15" rx="2" fill="#1976D2"/>
    <rect x="262" y="17" width="16" height="10" rx="1" fill="#fff"/>
    <circle cx="270" cy="22" r="2" fill="#25D366"/>
    <rect x="225" y="48" width="65" height="3" rx="1" fill="#2C3E50"/>
    <rect x="225" y="54" width="55" height="3" rx="1" fill="#2C3E50" opacity="0.6"/>
    <rect x="225" y="60" width="50" height="4" rx="1" fill="#25D366"/>
  </g>
  
  <!-- Professional certifications -->
  <g transform="translate(300, 60)">
    <rect x="0" y="0" width="80" height="30" rx="3" fill="#fff" opacity="0.9" stroke="#E5E7EB"/>
    <text x="40" y="10" text-anchor="middle" font-family="sans-serif" font-size="6" fill="#1976D2" font-weight="bold">Certificado</text>
    <text x="40" y="18" text-anchor="middle" font-family="sans-serif" font-size="5" fill="#2E7D32">Colegio de Psicólogos</text>
    <text x="40" y="25" text-anchor="middle" font-family="sans-serif" font-size="5" fill="#2C3E50">del Perú</text>
  </g>
  
  <!-- Rating and testimonials -->
  <g transform="translate(280, 100)" fill="#FFD700">
    <text x="0" y="8" font-family="sans-serif" font-size="8">★★★★★</text>
    <text x="45" y="8" font-family="sans-serif" font-size="6" fill="#2C3E50">(89)</text>
  </g>
  
  <!-- Contact information -->
  <g transform="translate(280, 115)">
    <rect x="0" y="0" width="60" height="3" rx="1" fill="#2C3E50" opacity="0.6"/>
    <rect x="0" y="6" width="80" height="3" rx="1" fill="#2C3E50" opacity="0.6"/>
  </g>
  
  <!-- Working hours -->
  <rect x="20" y="280" width="120" height="15" rx="3" fill="url(#medicalGradient)" opacity="0.8"/>
  <text x="80" y="290" text-anchor="middle" font-family="sans-serif" font-size="7" fill="#fff" font-weight="bold">Lun-Vie 9AM-7PM</text>
  
  <!-- Emergency contact -->
  <rect x="260" y="280" width="120" height="15" rx="3" fill="url(#peruGradient)"/>
  <circle cx="280" cy="287" r="4" fill="#fff"/>
  <text x="280" y="290" text-anchor="middle" font-family="sans-serif" font-size="5" fill="#C4302B" font-weight="bold">!</text>
  <text x="330" y="290" text-anchor="middle" font-family="sans-serif" font-size="7" fill="#fff" font-weight="bold">Emergencias 24/7</text>
  
  <!-- Peru flag accent -->
  <rect x="350" y="20" width="12" height="8" rx="1" fill="#fff"/>
  <rect x="350" y="20" width="4" height="8" fill="#C4302B"/>
  <rect x="358" y="20" width="4" height="8" fill="#C4302B"/>
  
  <!-- Medical privacy seal -->
  <g transform="translate(20, 120)">
    <circle cx="0" cy="0" r="12" fill="url(#medicalGradient)"/>
    <circle cx="0" cy="0" r="8" fill="#fff"/>
    <text x="0" y="3" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#2E7D32" font-weight="bold">✓</text>
    <text x="20" y="-5" font-family="sans-serif" font-size="5" fill="#2E7D32" font-weight="bold">Confidencial</text>
    <text x="20" y="2" font-family="sans-serif" font-size="4" fill="#2C3E50">y Seguro</text>
  </g>
  
  <!-- Professional border -->
  <rect x="0" y="295" width="400" height="5" fill="url(#trustGradient)"/>
  <rect x="0" y="295" width="15" height="5" fill="#FFD700"/>
  <rect x="30" y="295" width="15" height="5" fill="#FFD700"/>
  <rect x="355" y="295" width="15" height="5" fill="#FFD700"/>
  <rect x="385" y="295" width="15" height="5" fill="#FFD700"/>
</svg>
