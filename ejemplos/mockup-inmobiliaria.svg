<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <!-- Background -->
  <rect fill="#f8f9fa" width="400" height="300"/>
  
  <!-- Header -->
  <rect fill="#2c5aa0" width="400" height="50"/>
  <text x="20" y="30" fill="white" font-family="Arial" font-size="16" font-weight="bold">Lima Premium</text>
  <rect fill="#3d6bb3" x="320" y="15" width="60" height="20" rx="10"/>
  <text x="340" y="27" fill="white" font-family="Arial" font-size="10">Menú</text>
  
  <!-- Search Bar -->
  <rect fill="white" x="20" y="70" width="360" height="40" rx="20" stroke="#ddd" stroke-width="2"/>
  <text x="40" y="92" fill="#666" font-family="Arial" font-size="12">Buscar propiedades...</text>
  <circle fill="#2c5aa0" cx="360" cy="90" r="15"/>
  <text x="355" y="95" fill="white" font-family="Arial" font-size="12">🔍</text>
  
  <!-- Property Cards -->
  <rect fill="white" x="20" y="130" width="110" height="140" rx="8" stroke="#eee"/>
  <rect fill="#4e7cc6" x="25" y="135" width="100" height="70"/>
  <text x="70" y="175" fill="white" font-family="Arial" font-size="24" text-anchor="middle">🏠</text>
  <text x="25" y="220" fill="#2c5aa0" font-family="Arial" font-size="12" font-weight="bold">S/ 450,000</text>
  <text x="25" y="235" fill="#333" font-family="Arial" font-size="10">Casa en Miraflores</text>
  <text x="25" y="250" fill="#666" font-family="Arial" font-size="9">3 hab • 2 baños • 120m²</text>
  
  <rect fill="white" x="145" y="130" width="110" height="140" rx="8" stroke="#eee"/>
  <rect fill="#5f8dd9" x="150" y="135" width="100" height="70"/>
  <text x="195" y="175" fill="white" font-family="Arial" font-size="24" text-anchor="middle">🏢</text>
  <text x="150" y="220" fill="#2c5aa0" font-family="Arial" font-size="12" font-weight="bold">S/ 2,800/mes</text>
  <text x="150" y="235" fill="#333" font-family="Arial" font-size="10">Oficina San Isidro</text>
  <text x="150" y="250" fill="#666" font-family="Arial" font-size="9">2 baños • 80m² • Estac.</text>
  
  <rect fill="white" x="270" y="130" width="110" height="140" rx="8" stroke="#eee"/>
  <rect fill="#85c1e9" x="275" y="135" width="100" height="70"/>
  <text x="320" y="175" fill="white" font-family="Arial" font-size="24" text-anchor="middle">🌊</text>
  <text x="275" y="220" fill="#2c5aa0" font-family="Arial" font-size="12" font-weight="bold">S/ 850,000</text>
  <text x="275" y="235" fill="#333" font-family="Arial" font-size="10">Vista al mar</text>
  <text x="275" y="250" fill="#666" font-family="Arial" font-size="9">4 hab • 3 baños • 150m²</text>
</svg>