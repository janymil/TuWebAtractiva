<svg width="600" height="400" viewBox="0 0 600 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="600" height="400" fill="#f8fffe"/>
  
  <!-- Header -->
  <rect width="600" height="80" fill="#22c55e"/>
  <circle cx="50" cy="40" r="15" fill="white"/>
  <text x="80" y="35" fill="white" font-family="Arial" font-size="14" font-weight="bold">🥗 Nutricionista</text>
  <text x="80" y="55" fill="white" font-family="Arial" font-size="10">Dra. Ana Gutierrez</text>
  
  <!-- Hero Section -->
  <rect x="40" y="100" width="200" height="120" rx="10" fill="#e5f9f0"/>
  <text x="50" y="130" fill="#16a34a" font-family="Arial" font-size="16" font-weight="bold">Transforma tu salud</text>
  <text x="50" y="150" fill="#374151" font-family="Arial" font-size="10">con planes personalizados</text>
  <text x="50" y="165" fill="#374151" font-family="Arial" font-size="10">de nutrición y bienestar</text>
  <rect x="50" y="180" width="80" height="25" rx="12" fill="#22c55e"/>
  <text x="80" y="197" fill="white" font-family="Arial" font-size="8">Agendar Cita</text>
  
  <!-- Services Section -->
  <text x="280" y="130" fill="#1f2937" font-family="Arial" font-size="14" font-weight="bold">Servicios</text>
  
  <!-- Service Cards -->
  <rect x="280" y="140" width="120" height="60" rx="5" fill="white" stroke="#e5e7eb"/>
  <circle cx="295" cy="155" r="8" fill="#10b981"/>
  <text x="310" y="155" fill="#374151" font-family="Arial" font-size="9">Consulta Nutricional</text>
  <text x="285" y="175" fill="#6b7280" font-family="Arial" font-size="7">Evaluación completa</text>
  <text x="285" y="185" fill="#6b7280" font-family="Arial" font-size="7">y plan personalizado</text>
  
  <rect x="420" y="140" width="120" height="60" rx="5" fill="white" stroke="#e5e7eb"/>
  <circle cx="435" cy="155" r="8" fill="#f59e0b"/>
  <text x="450" y="155" fill="#374151" font-family="Arial" font-size="9">Planes de Alimentación</text>
  <text x="425" y="175" fill="#6b7280" font-family="Arial" font-size="7">Dietas balanceadas</text>
  <text x="425" y="185" fill="#6b7280" font-family="Arial" font-size="7">según tus objetivos</text>
  
  <!-- Testimonials -->
  <text x="40" y="250" fill="#1f2937" font-family="Arial" font-size="14" font-weight="bold">Lo que dicen mis pacientes</text>
  
  <rect x="40" y="260" width="250" height="50" rx="5" fill="white" stroke="#e5e7eb"/>
  <text x="50" y="280" fill="#374151" font-family="Arial" font-size="8">"Bajé 15kg en 4 meses de forma saludable."</text>
  <text x="50" y="295" fill="#6b7280" font-family="Arial" font-size="7">- María L.</text>
  
  <rect x="310" y="260" width="250" height="50" rx="5" fill="white" stroke="#e5e7eb"/>
  <text x="320" y="280" fill="#374151" font-family="Arial" font-size="8">"Excelente atención y resultados increíbles."</text>
  <text x="320" y="295" fill="#6b7280" font-family="Arial" font-size="7">- Carlos R.</text>
  
  <!-- Contact Section -->
  <rect x="40" y="330" width="520" height="50" rx="5" fill="#22c55e"/>
  <text x="260" y="350" fill="white" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle">📱 WhatsApp: +51 999 888 777</text>
  <text x="260" y="365" fill="white" font-family="Arial" font-size="10" text-anchor="middle">Agenda tu consulta nutricional hoy</text>
