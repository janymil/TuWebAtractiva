<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <linearGradient id="warmGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8B4513;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#A0522D;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="foodGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF6347;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF4500;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="peruGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#C4302B;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#A02A26;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background representing restaurant website -->
  <rect width="400" height="300" fill="#FFF8DC"/>
  
  <!-- Header/Navigation -->
  <rect x="0" y="0" width="400" height="50" fill="url(#warmGradient)"/>
  <rect x="20" y="15" width="80" height="20" rx="3" fill="#fff" opacity="0.9"/>
  <text x="60" y="28" text-anchor="middle" font-family="serif" font-size="12" fill="#8B4513" font-weight="bold">El Sabor Criollo</text>
  
  <!-- Navigation menu -->
  <rect x="280" y="18" width="30" height="4" rx="1" fill="#fff" opacity="0.8"/>
  <rect x="320" y="18" width="25" height="4" rx="1" fill="#fff" opacity="0.8"/>
  <rect x="355" y="18" width="30" height="4" rx="1" fill="#fff" opacity="0.8"/>
  
  <!-- Hero section -->
  <rect x="0" y="50" width="400" height="120" fill="url(#foodGradient)" opacity="0.3"/>
  
  <!-- Restaurant image placeholder -->
  <rect x="20" y="65" width="160" height="90" rx="8" fill="url(#peruGradient)" opacity="0.8"/>
  <circle cx="100" cy="110" r="25" fill="#fff" opacity="0.9"/>
  <path d="M 85 110 Q 100 95 115 110 Q 100 125 85 110" fill="url(#foodGradient)"/>
  
  <!-- Restaurant info -->
  <rect x="200" y="70" width="120" height="8" rx="2" fill="#8B4513"/>
  <rect x="200" y="85" width="150" height="4" rx="1" fill="#2C3E50" opacity="0.7"/>
  <rect x="200" y="92" width="140" height="4" rx="1" fill="#2C3E50" opacity="0.7"/>
  <rect x="200" y="99" width="100" height="4" rx="1" fill="#2C3E50" opacity="0.7"/>
  
  <!-- WhatsApp button -->
  <rect x="200" y="115" width="80" height="25" rx="12" fill="#25D366"/>
  <circle cx="215" cy="127" r="6" fill="#fff"/>
  <path d="M 212 127 Q 215 124 218 127 Q 215 130 212 127" fill="#25D366"/>
  <text x="255" y="130" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#fff" font-weight="bold">WhatsApp</text>
  
  <!-- Menu section -->
  <rect x="20" y="185" width="360" height="8" rx="2" fill="#8B4513"/>
  <text x="200" y="195" text-anchor="middle" font-family="serif" font-size="10" fill="#8B4513" font-weight="bold">Nuestro Menú</text>
  
  <!-- Menu items -->
  <g transform="translate(20, 210)">
    <!-- Dish 1 -->
    <rect x="0" y="0" width="110" height="70" rx="5" fill="#fff" stroke="#E5E7EB"/>
    <rect x="5" y="5" width="100" height="45" rx="3" fill="url(#foodGradient)" opacity="0.6"/>
    <circle cx="55" cy="27" r="12" fill="#fff" opacity="0.9"/>
    <path d="M 48 27 Q 55 20 62 27 Q 55 34 48 27" fill="#FF4500"/>
    <rect x="5" y="53" width="60" height="4" rx="1" fill="#2C3E50"/>
    <rect x="5" y="59" width="40" height="3" rx="1" fill="#C4302B"/>
    
    <!-- Dish 2 -->
    <rect x="125" y="0" width="110" height="70" rx="5" fill="#fff" stroke="#E5E7EB"/>
    <rect x="130" y="5" width="100" height="45" rx="3" fill="url(#peruGradient)" opacity="0.6"/>
    <circle cx="180" cy="27" r="12" fill="#fff" opacity="0.9"/>
    <rect x="175" y="22" width="10" height="10" rx="2" fill="#FFD700"/>
    <rect x="130" y="53" width="70" height="4" rx="1" fill="#2C3E50"/>
    <rect x="130" y="59" width="45" height="3" rx="1" fill="#C4302B"/>
    
    <!-- Dish 3 -->
    <rect x="250" y="0" width="110" height="70" rx="5" fill="#fff" stroke="#E5E7EB"/>
    <rect x="255" y="5" width="100" height="45" rx="3" fill="url(#warmGradient)" opacity="0.6"/>
    <circle cx="305" cy="27" r="12" fill="#fff" opacity="0.9"/>
    <ellipse cx="305" cy="27" rx="8" ry="6" fill="#8B4513"/>
    <rect x="255" y="53" width="65" height="4" rx="1" fill="#2C3E50"/>
    <rect x="255" y="59" width="50" height="3" rx="1" fill="#C4302B"/>
  </g>
  
  <!-- Peruvian flag accent -->
  <rect x="350" y="20" width="15" height="10" rx="1" fill="#fff"/>
  <rect x="350" y="20" width="5" height="10" fill="#C4302B"/>
  <rect x="360" y="20" width="5" height="10" fill="#C4302B"/>
  
  <!-- Rating stars -->
  <g transform="translate(280, 120)" fill="#FFD700">
    <text x="0" y="8" font-family="sans-serif" font-size="10">★★★★★</text>
  </g>
  
  <!-- Location marker -->
  <g transform="translate(320, 65)">
    <circle cx="0" cy="0" r="8" fill="#C4302B"/>
    <circle cx="0" cy="-2" r="3" fill="#fff"/>
  </g>
  
  <!-- Opening hours -->
  <rect x="200" y="140" width="100" height="3" rx="1" fill="#2C3E50" opacity="0.6"/>
  <rect x="200" y="146" width="80" height="3" rx="1" fill="#2C3E50" opacity="0.6"/>
  
  <!-- Traditional pattern border -->
  <rect x="0" y="295" width="400" height="5" fill="url(#peruGradient)"/>
  <rect x="0" y="295" width="20" height="5" fill="#FFD700"/>
  <rect x="40" y="295" width="20" height="5" fill="#FFD700"/>
  <rect x="80" y="295" width="20" height="5" fill="#FFD700"/>
  <rect x="360" y="295" width="20" height="5" fill="#FFD700"/>
  <rect x="320" y="295" width="20" height="5" fill="#FFD700"/>
  <rect x="280" y="295" width="20" height="5" fill="#FFD700"/>
</svg>
