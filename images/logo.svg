
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 60" width="320" height="60">
  <defs>
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#C4302B;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#A02A26;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E6C200;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Globe/World Icon -->
  <circle cx="30" cy="30" r="25" fill="url(#logoGradient)" stroke="#2C3E50" stroke-width="2"/>
  
  <!-- Globe lines - horizontal -->
  <ellipse cx="30" cy="30" rx="25" ry="8" fill="none" stroke="#2C3E50" stroke-width="1.5"/>
  <ellipse cx="30" cy="30" rx="25" ry="16" fill="none" stroke="#2C3E50" stroke-width="1"/>
  
  <!-- Globe lines - vertical -->
  <ellipse cx="30" cy="30" rx="8" ry="25" fill="none" stroke="#2C3E50" stroke-width="1.5"/>
  <ellipse cx="30" cy="30" rx="16" ry="25" fill="none" stroke="#2C3E50" stroke-width="1"/>
  
  <!-- Central meridian -->
  <line x1="30" y1="5" x2="30" y2="55" stroke="#2C3E50" stroke-width="1.5"/>
  
  <!-- Continents representation -->
  <path d="M15 20 Q20 18 25 22 Q30 25 35 20 Q40 23 45 25" fill="none" stroke="#FFD700" stroke-width="2" stroke-linecap="round"/>
  <path d="M12 35 Q18 32 24 36 Q32 38 38 35 Q42 37 48 40" fill="none" stroke="#FFD700" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Main Text -->
  <text x="70" y="25" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#2C3E50">Tu Web Atractiva</text>
  
  <!-- Subtitle -->
  <text x="70" y="42" font-family="Arial, sans-serif" font-size="10" fill="#666">eleva tu presencia online</text>
  
  <!-- Decorative elements -->
  <circle cx="290" cy="15" r="2" fill="url(#accentGradient)" opacity="0.8"/>
  <circle cx="300" cy="45" r="1.5" fill="url(#accentGradient)" opacity="0.6"/>
  <circle cx="280" cy="50" r="1" fill="url(#accentGradient)" opacity="0.7"/>
</svg>
