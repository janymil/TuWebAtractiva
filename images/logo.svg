
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 100" width="400" height="100">
  <defs>
    <linearGradient id="globeGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2E5BBA;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1E3A8A;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="ringGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3B82F6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1D4ED8;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Main globe -->
  <circle cx="50" cy="50" r="25" fill="url(#globeGradient)" stroke="#fff" stroke-width="1"/>
  
  <!-- Orbital rings -->
  <ellipse cx="50" cy="50" rx="35" ry="15" fill="none" stroke="url(#ringGradient)" stroke-width="2" opacity="0.8"/>
  <ellipse cx="50" cy="50" rx="35" ry="15" fill="none" stroke="url(#ringGradient)" stroke-width="2" opacity="0.6" transform="rotate(60 50 50)"/>
  <ellipse cx="50" cy="50" rx="35" ry="15" fill="none" stroke="url(#ringGradient)" stroke-width="2" opacity="0.4" transform="rotate(120 50 50)"/>
  
  <!-- Globe grid lines -->
  <path d="M 25 50 Q 50 35 75 50 Q 50 65 25 50" fill="none" stroke="#fff" stroke-width="1" opacity="0.6"/>
  <path d="M 25 50 Q 50 65 75 50 Q 50 35 25 50" fill="none" stroke="#fff" stroke-width="1" opacity="0.6"/>
  <line x1="50" y1="25" x2="50" y2="75" stroke="#fff" stroke-width="1" opacity="0.6"/>
  <line x1="25" y1="50" x2="75" y2="50" stroke="#fff" stroke-width="1" opacity="0.6"/>
  
  <!-- Text: Tu Web Atractiva -->
  <text x="110" y="45" font-family="Montserrat, Arial, sans-serif" font-size="24" font-weight="700" fill="#2E5BBA">Tu Web Atractiva</text>
  
  <!-- Tagline: eleva tu presencia online -->
  <text x="110" y="65" font-family="Montserrat, Arial, sans-serif" font-size="12" font-weight="400" fill="#64748B">eleva tu presencia online</text>
</svg>
