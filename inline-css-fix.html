<!-- Add this CSS at the top of your Gutenberg Custom HTML block -->
<style>
.wp-articulo-content * {
    box-sizing: border-box;
}

.wp-articulo-content {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    line-height: 1.7;
    color: #333;
}

.wp-articulo-content .articulo-container {
    max-width: 1000px;
    margin: 0 auto;
    background: white;
    box-shadow: 0 0 30px rgba(0,0,0,0.1);
    border-radius: 20px;
    overflow: hidden;
    margin-top: 20px;
    margin-bottom: 20px;
}

.wp-articulo-content .articulo-hero-section {
    background: linear-gradient(135deg, #c41e3a 0%, #ff6b6b 100%);
    color: white;
    padding: 60px 40px;
    text-align: center;
    position: relative;
    overflow: hidden;
}

.wp-articulo-content .articulo-hero-section::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><circle cx="20" cy="20" r="2" fill="rgba(255,255,255,0.1)"/><circle cx="80" cy="40" r="3" fill="rgba(255,255,255,0.1)"/><circle cx="40" cy="80" r="1" fill="rgba(255,255,255,0.1)"/></svg>');
    opacity: 0.3;
}

.wp-articulo-content .articulo-hero-content {
    position: relative;
    z-index: 1;
}

.wp-articulo-content .articulo-hero-title {
    font-size: 2.5rem;
    font-weight: 700;
    margin-bottom: 20px;
    text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
}

.wp-articulo-content .articulo-hero-subtitle {
    font-size: 1.2rem;
    opacity: 0.9;
    margin-bottom: 30px;
}

.wp-articulo-content .articulo-peru-flag {
    display: inline-block;
    width: 30px;
    height: 20px;
    background: linear-gradient(to right, #c41e3a 33%, white 33%, white 66%, #c41e3a 66%);
    border-radius: 3px;
    margin: 0 10px;
    vertical-align: middle;
}

.wp-articulo-content .articulo-progress-bar {
    position: fixed;
    top: 0;
    left: 0;
    width: 0%;
    height: 4px;
    background: linear-gradient(90deg, #c41e3a, #ff6b6b);
    z-index: 1000;
    transition: width 0.3s ease;
}

.wp-articulo-content .articulo-stats-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 20px;
    margin: 30px 0;
}

.wp-articulo-content .articulo-stat-card {
    background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
    color: white;
    padding: 25px;
    border-radius: 15px;
    text-align: center;
    transform: translateY(0);
    transition: transform 0.3s ease;
    cursor: pointer;
}

.wp-articulo-content .articulo-stat-card:hover {
    transform: translateY(-5px);
}

.wp-articulo-content .articulo-stat-number {
    font-size: 2.5rem;
    font-weight: 700;
    display: block;
}

.wp-articulo-content .articulo-section-title {
    font-size: 2rem;
    color: #c41e3a;
    margin-bottom: 20px;
    position: relative;
    padding-left: 30px;
}

.wp-articulo-content .articulo-section-title::before {
    content: '';
    position: absolute;
    left: 0;
    top: 50%;
    transform: translateY(-50%);
    width: 20px;
    height: 4px;
    background: linear-gradient(45deg, #c41e3a, #ff6b6b);
    border-radius: 2px;
}

.wp-articulo-content .articulo-highlight-box {
    background: linear-gradient(135deg, #fff5f5 0%, #ffe8e8 100%);
    border-left: 5px solid #c41e3a;
    padding: 25px;
    margin: 30px 0;
    border-radius: 10px;
    box-shadow: 0 5px 15px rgba(196, 30, 58, 0.1);
}

/* Add more critical styles here - this is a condensed version */
</style>

<!-- Add this JavaScript at the bottom -->
<script>
jQuery(document).ready(function($) {
    // Progress bar
    $(window).scroll(function() {
        const scrollTop = $(document).scrollTop();
        const docHeight = $(document).height();
        const winHeight = $(window).height();
        const scrollPercent = (scrollTop) / (docHeight - winHeight);
        const scrollPercentRounded = Math.round(scrollPercent * 100);
        $('#articuloProgressBar').css('width', scrollPercentRounded + '%');
    });

    // Interactive stat cards
    $('.wp-articulo-content .articulo-stat-card').click(function() {
        $(this).css('transform', 'scale(1.05)');
        setTimeout(() => {
            $(this).css('transform', 'translateY(-5px)');
        }, 200);
    });

    // Section animations
    function checkVisibility() {
        $('.wp-articulo-content .articulo-section').each(function() {
            var elementTop = $(this).offset().top;
            var elementBottom = elementTop + $(this).outerHeight();
            var viewportTop = $(window).scrollTop();
            var viewportBottom = viewportTop + $(window).height();
            
            if (elementBottom > viewportTop && elementTop < viewportBottom) {
                $(this).addClass('visible');
            }
        });
    }

    $(window).scroll(checkVisibility);
    checkVisibility();
});
</script>
