<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F8F9FA;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E9ECEF;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="primaryGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#C4302B;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#A02A26;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E6C200;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="screenGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2C3E50;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1A252F;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="600" fill="url(#bgGradient)"/>
  
  <!-- Decorative background elements -->
  <circle cx="650" cy="100" r="60" fill="url(#primaryGradient)" opacity="0.1"/>
  <circle cx="150" cy="500" r="80" fill="url(#accentGradient)" opacity="0.08"/>
  <circle cx="700" cy="450" r="40" fill="url(#primaryGradient)" opacity="0.12"/>
  
  <!-- Main devices group -->
  <g transform="translate(200, 100)">
    
    <!-- Desktop Computer -->
    <g transform="translate(0, 0)">
      <!-- Monitor -->
      <rect x="0" y="0" width="300" height="200" rx="8" fill="#fff" stroke="#E5E7EB" stroke-width="3"/>
      <rect x="10" y="10" width="280" height="160" rx="4" fill="url(#screenGradient)"/>
      
      <!-- Website content on screen -->
      <rect x="20" y="25" width="60" height="8" rx="2" fill="#C4302B"/>
      <rect x="90" y="25" width="40" height="6" rx="1" fill="#fff" opacity="0.8"/>
      <rect x="140" y="25" width="50" height="6" rx="1" fill="#fff" opacity="0.8"/>
      <rect x="200" y="25" width="45" height="6" rx="1" fill="#fff" opacity="0.8"/>
      
      <!-- Hero section simulation -->
      <rect x="20" y="45" width="120" height="40" rx="3" fill="#C4302B" opacity="0.8"/>
      <rect x="25" y="50" width="60" height="4" rx="1" fill="#fff"/>
      <rect x="25" y="58" width="80" height="3" rx="1" fill="#fff" opacity="0.8"/>
      <rect x="25" y="65" width="70" height="3" rx="1" fill="#fff" opacity="0.8"/>
      <rect x="25" y="75" width="35" height="8" rx="2" fill="#FFD700"/>
      
      <!-- Content cards -->
      <rect x="150" y="45" width="110" height="35" rx="3" fill="#fff" opacity="0.9"/>
      <rect x="155" y="50" width="50" height="3" rx="1" fill="#2C3E50"/>
      <rect x="155" y="57" width="80" height="2" rx="1" fill="#2C3E50" opacity="0.6"/>
      <rect x="155" y="62" width="70" height="2" rx="1" fill="#2C3E50" opacity="0.6"/>
      <rect x="155" y="70" width="30" height="6" rx="1" fill="#C4302B"/>
      
      <!-- Service cards -->
      <rect x="20" y="95" width="70" height="50" rx="3" fill="#fff" opacity="0.9"/>
      <circle cx="35" cy="110" r="6" fill="#C4302B"/>
      <rect x="25" y="120" width="40" height="2" rx="1" fill="#2C3E50"/>
      <rect x="25" y="125" width="50" height="2" rx="1" fill="#2C3E50" opacity="0.6"/>
      <rect x="25" y="135" width="25" height="5" rx="1" fill="#28A745"/>
      
      <rect x="100" y="95" width="70" height="50" rx="3" fill="#fff" opacity="0.9"/>
      <circle cx="115" cy="110" r="6" fill="#C4302B"/>
      <rect x="105" y="120" width="40" height="2" rx="1" fill="#2C3E50"/>
      <rect x="105" y="125" width="50" height="2" rx="1" fill="#2C3E50" opacity="0.6"/>
      <rect x="105" y="135" width="25" height="5" rx="1" fill="#28A745"/>
      
      <rect x="180" y="95" width="70" height="50" rx="3" fill="#fff" opacity="0.9"/>
      <circle cx="195" cy="110" r="6" fill="#C4302B"/>
      <rect x="185" y="120" width="40" height="2" rx="1" fill="#2C3E50"/>
      <rect x="185" y="125" width="50" height="2" rx="1" fill="#2C3E50" opacity="0.6"/>
      <rect x="185" y="135" width="25" height="5" rx="1" fill="#28A745"/>
      
      <!-- Monitor stand -->
      <rect x="140" y="200" width="20" height="30" rx="3" fill="#E5E7EB"/>
      <rect x="120" y="230" width="60" height="8" rx="4" fill="#E5E7EB"/>
    </g>
    
    <!-- Mobile Phone -->
    <g transform="translate(350, 50)">
      <rect x="0" y="0" width="80" height="140" rx="12" fill="#fff" stroke="#E5E7EB" stroke-width="2"/>
      <rect x="8" y="15" width="64" height="110" rx="6" fill="url(#screenGradient)"/>
      
      <!-- Mobile website content -->
      <rect x="12" y="20" width="20" height="4" rx="1" fill="#C4302B"/>
      <rect x="40" y="20" width="12" height="3" rx="1" fill="#fff" opacity="0.8"/>
      <rect x="54" y="20" width="8" height="3" rx="1" fill="#fff" opacity="0.8"/>
      
      <!-- Mobile hero -->
      <rect x="12" y="30" width="56" height="25" rx="2" fill="#C4302B" opacity="0.8"/>
      <rect x="15" y="33" width="30" height="2" rx="1" fill="#fff"/>
      <rect x="15" y="37" width="40" height="1.5" rx="0.5" fill="#fff" opacity="0.8"/>
      <rect x="15" y="41" width="35" height="1.5" rx="0.5" fill="#fff" opacity="0.8"/>
      <rect x="15" y="47" width="20" height="5" rx="1" fill="#FFD700"/>
      
      <!-- Mobile cards -->
      <rect x="12" y="60" width="56" height="18" rx="2" fill="#fff" opacity="0.9"/>
      <circle cx="20" cy="67" r="3" fill="#C4302B"/>
      <rect x="26" y="64" width="25" height="1.5" rx="0.5" fill="#2C3E50"/>
      <rect x="26" y="67" width="30" height="1" rx="0.5" fill="#2C3E50" opacity="0.6"/>
      <rect x="26" y="72" width="15" height="3" rx="0.5" fill="#28A745"/>
      
      <rect x="12" y="82" width="56" height="18" rx="2" fill="#fff" opacity="0.9"/>
      <circle cx="20" cy="89" r="3" fill="#C4302B"/>
      <rect x="26" y="86" width="25" height="1.5" rx="0.5" fill="#2C3E50"/>
      <rect x="26" y="89" width="30" height="1" rx="0.5" fill="#2C3E50" opacity="0.6"/>
      <rect x="26" y="94" width="15" height="3" rx="0.5" fill="#28A745"/>
      
      <rect x="12" y="104" width="56" height="18" rx="2" fill="#fff" opacity="0.9"/>
      <circle cx="20" cy="111" r="3" fill="#C4302B"/>
      <rect x="26" y="108" width="25" height="1.5" rx="0.5" fill="#2C3E50"/>
      <rect x="26" y="111" width="30" height="1" rx="0.5" fill="#2C3E50" opacity="0.6"/>
      <rect x="26" y="116" width="15" height="3" rx="0.5" fill="#28A745"/>
      
      <!-- Home button -->
      <circle cx="40" cy="130" r="3" fill="#E5E7EB"/>
    </g>
    
  </g>
  
  <!-- Floating elements representing web technologies -->
  <g opacity="0.6">
    <!-- HTML tag -->
    <g transform="translate(100, 200)">
      <rect x="0" y="0" width="40" height="20" rx="3" fill="url(#accentGradient)"/>
      <text x="20" y="13" text-anchor="middle" font-family="monospace" font-size="8" fill="#2C3E50" font-weight="bold">HTML</text>
    </g>
    
    <!-- CSS tag -->
    <g transform="translate(550, 300)">
      <rect x="0" y="0" width="35" height="20" rx="3" fill="url(#primaryGradient)"/>
      <text x="17.5" y="13" text-anchor="middle" font-family="monospace" font-size="8" fill="#fff" font-weight="bold">CSS</text>
    </g>
    
    <!-- Responsive tag -->
    <g transform="translate(80, 450)">
      <rect x="0" y="0" width="60" height="20" rx="3" fill="#28A745"/>
      <text x="30" y="13" text-anchor="middle" font-family="sans-serif" font-size="7" fill="#fff" font-weight="bold">RESPONSIVE</text>
    </g>
    
    <!-- SEO tag -->
    <g transform="translate(600, 180)">
      <rect x="0" y="0" width="30" height="20" rx="3" fill="url(#accentGradient)"/>
      <text x="15" y="13" text-anchor="middle" font-family="monospace" font-size="8" fill="#2C3E50" font-weight="bold">SEO</text>
    </g>
  </g>
  
  <!-- Connection lines between devices -->
  <g stroke="#C4302B" stroke-width="2" fill="none" opacity="0.3">
    <path d="M 500 250 Q 550 200 550 150" stroke-dasharray="5,5"/>
    <path d="M 350 300 Q 300 250 250 200" stroke-dasharray="5,5"/>
  </g>
  
  <!-- Decorative dots pattern -->
  <g fill="url(#primaryGradient)" opacity="0.2">
    <circle cx="50" cy="80" r="2"/>
    <circle cx="70" cy="120" r="1.5"/>
    <circle cx="30" cy="160" r="2"/>
    <circle cx="750" cy="350" r="2"/>
    <circle cx="720" cy="320" r="1.5"/>
    <circle cx="680" cy="380" r="2"/>
  </g>
  
  <!-- Success indicators -->
  <g transform="translate(250, 350)">
    <circle cx="0" cy="0" r="15" fill="#28A745"/>
    <path d="M -6 0 L -2 4 L 6 -4" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round"/>
  </g>
  
  <g transform="translate(450, 280)">
    <circle cx="0" cy="0" r="12" fill="url(#accentGradient)"/>
    <text x="0" y="4" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#2C3E50" font-weight="bold">✓</text>
  </g>
</svg>
